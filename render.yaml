services:
  - type: web
    name: bridge-ai-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/activities
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: static
    name: bridge-ai-frontend
    region: frankfurt
    buildCommand: npm install && npm run build -- --prod
    staticPublishPath: ./dist/bridge-ai-angular/browser
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
