

<style>
/* ─── IMPORTS ──────────────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ─── VARIABLES ──────────────────────────────────────────────────── */
:root {
    --hdr-forest: #0b4d3b;
    --hdr-forest-dark: #072f23;
    --hdr-gold: #c8922a;
    --hdr-ink: #0e1e16;
    --hdr-muted: #004a25;
    --hdr-hint: #007d30;
    --hdr-bg: rgb(255, 255, 255);
    --hdr-border: rgba(11, 77, 59, 0.08);
    --hdr-hover: rgba(11, 77, 59, 0.05);
    --hdr-active: rgba(11, 77, 59, 0.10);
    --hdr-radius: 8px;
    --hdr-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --hdr-height: 80px;
    --hdr-height-m: 64px;
}

/* ─── HEADER SHELL ───────────────────────────────────────────────── */
.site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--hdr-height);
    z-index: 9999;
    display: flex;
    align-items: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    transition: height 0.3s var(--hdr-ease), box-shadow 0.3s var(--hdr-ease);
}

.header-bg {
    position: absolute;
    inset: 0;
    background: var(--hdr-bg);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--hdr-border);
    transition: background 0.3s var(--hdr-ease);
}

.site-header.scrolled .header-bg {
    background: rgb(255, 255, 255);
    border-bottom-color: rgba(11, 77, 59, 0.12);
}

.site-header.scrolled {
    box-shadow: 0 2px 32px rgba(0, 0, 0, 0.06);
}

.header-container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    position: relative;
    z-index: 2;
    gap: 16px;
}

/* ─── BRAND — BRIDGE-AI → EU ────────────────────────────────────── */
.header-brand {
    flex-shrink: 0;
    display: flex;
    align-items: center;
}

.brand-link {
    display: flex;
    align-items: center;
    text-decoration: none;
    transition: opacity 0.3s var(--hdr-ease);
}

.brand-link:hover { opacity: 0.85; }

.brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-item {
    display: flex;
    align-items: center;
}

.brand-logo {
    height: auto;
    width: auto;
    display: block;
    transition: transform 0.3s var(--hdr-ease);
}

.brand-logo-bridge {
    height: 56px;
}

.brand-logo-eu {
    height: 40px;
}

.brand-divider {
    width: 1.5px;
    height: 32px;
    background: linear-gradient(180deg, transparent, var(--hdr-border), transparent);
    flex-shrink: 0;
}

/* ─── NAVIGATION — Clean, No Dropdowns ──────────────────────────── */
.main-nav {
    display: flex;
    align-items: center;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
}

.nav-list {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 4px;
    margin: 0;
    padding: 0;
    flex-wrap: nowrap;
}

.nav-item { position: relative; }

.nav-link {
    display: flex;
    align-items: center;
    padding: 8px 18px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--hdr-muted);
    text-decoration: none;
    border-radius: var(--hdr-radius);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: all 0.25s var(--hdr-ease);
    font-family: inherit;
    letter-spacing: 0.01em;
}

.nav-link:hover {
    color: blue;
    
}

.nav-link.active {
    color: var(--hdr-forest);
    background: var(--hdr-active);
    font-weight: 600;
}

.nav-underline {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 24px;
    height: 2.5px;
    background: var(--hdr-forest);
    border-radius: 3px;
    transition: transform 0.3s var(--hdr-ease);
}

.nav-link.active .nav-underline {
    transform: translateX(-50%) scaleX(1);
}

.nav-link:hover .nav-underline {
    transform: translateX(-50%) scaleX(0.6);
}

/* ─── HAMBURGER ──────────────────────────────────────────────────── */
.mobile-controls { display: none; }

.hamburger-btn {
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    padding: 10px;
    cursor: pointer;
    border-radius: var(--hdr-radius);
    transition: background 0.2s ease;
    z-index: 9200;
}

.hamburger-btn:hover { background: var(--hdr-hover); }

.hamburger-line {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--hdr-ink);
    border-radius: 3px;
    transition: all 0.3s var(--hdr-ease);
    transform-origin: center;
}

.hamburger-btn.active .hamburger-line:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}
.hamburger-btn.active .hamburger-line:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
}
.hamburger-btn.active .hamburger-line:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

/* ─── MOBILE OVERLAY ────────────────────────────────────────────── */
.mobile-overlay {
    position: fixed;
    inset: 0;
    z-index: 9800;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s var(--hdr-ease), visibility 0s linear 0.4s;
    pointer-events: none;
}

.mobile-overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.4s var(--hdr-ease);
}

.mobile-scrim {
    position: absolute;
    inset: 0;
    background: rgba(10, 22, 16, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.mobile-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 32px;
    max-height: 92vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.mobile-overlay.active .mobile-sheet {
    transform: translateY(0);
}

.mobile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hdr-border);
}

.mobile-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.mobile-logo {
    height: 100%;
    width: auto;
    display: block;
}

.mobile-logo-bridge {
    height: 32px;
}

.mobile-logo-eu {
    height: 42px;
}

.mobile-brand-divider {
    width: 1px;
    height: 24px;
    background: var(--hdr-border);
}

.mobile-close {
    background: var(--hdr-hover);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--hdr-forest);
    transition: all 0.3s var(--hdr-ease);
}

.mobile-close:hover {
    background: var(--hdr-active);
    transform: rotate(90deg);
}

.mobile-nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0;
    margin: 0;
}

.mobile-nav-list li {
    opacity: 0;
    transform: translateY(16px);
}

.mobile-overlay.active .mobile-nav-list li {
    animation: slideUp 0.4s var(--hdr-ease) var(--delay, 0s) forwards;
}

@keyframes slideUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.mobile-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: var(--hdr-radius);
    text-decoration: none;
    color: var(--hdr-muted);
    font-size: 15px;
    font-weight: 400;
    font-family: inherit;
    transition: all 0.15s ease;
}

.mobile-link:hover {
    background: var(--hdr-hover);
    color: var(--hdr-forest);
}

.mobile-link.active {
    background: var(--hdr-active);
    color: var(--hdr-forest);
    font-weight: 500;
}

.mobile-icon {
    width: 28px;
    height: 28px;
    background: var(--hdr-hover);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--hdr-hint);
    font-weight: 700;
}

.mobile-link.active .mobile-icon {
    background: var(--hdr-active);
    color: var(--hdr-forest);
}

.mobile-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--hdr-border);
}

.mobile-footer-bar {
    width: 48px;
    height: 2px;
    background: linear-gradient(90deg, var(--hdr-forest), var(--hdr-gold));
    border-radius: 2px;
    margin-bottom: 10px;
}

.mobile-footer-text {
    font-size: 11.5px;
    color: var(--hdr-hint);
    margin: 0;
}

.mobile-footer-sub {
    font-size: 10px;
    color: rgba(138, 170, 150, 0.6);
    margin: 2px 0 0;
}

/* ─── RESPONSIVE ────────────────────────────────────────────────── */

/* Tablet — collapse nav */
@media (max-width: 960px) {
    .main-nav {
        display: none;
    }
    .mobile-controls {
        display: flex;
    }
    .site-header {
        height: var(--hdr-height-m);
    }
    .brand-logo-bridge {
        height: 40px;
    }
    .brand-logo-eu {
        height: 28px;
    }
    .brand-divider {
        height: 24px;
    }
    .brand-group {
        gap: 8px;
    }
    .header-container {
        padding: 0 20px;
    }
}

/* Small tablet — reduce spacing */
@media (max-width: 768px) {
    .header-container {
        padding: 0 16px;
    }
    .brand-logo-bridge {
        height: 34px;
    }
    .brand-logo-eu {
        height: 24px;
    }
    .brand-divider {
        height: 20px;
    }
    .brand-group {
        gap: 6px;
    }
    .mobile-sheet {
        padding: 20px 16px 28px;
    }
    .mobile-logo-bridge {
        height: 28px;
    }
    .mobile-logo-eu {
        height: 20px;
    }
    .mobile-link {
        font-size: 14px;
        padding: 10px 14px;
    }
}

/* Mobile small — compact */
@media (max-width: 480px) {
    .header-container {
        padding: 0 12px;
    }
    .brand-logo-bridge {
        height: 28px;
    }
    .brand-logo-eu {
        height: 20px;
    }
    .brand-divider {
        height: 16px;
    }
    .brand-group {
        gap: 4px;
    }
    .hamburger-btn {
        padding: 8px;
    }
    .hamburger-line {
        width: 18px;
        height: 1.8px;
    }
    .hamburger-btn.active .hamburger-line:nth-child(1) {
        transform: translateY(5.5px) rotate(45deg);
    }
    .hamburger-btn.active .hamburger-line:nth-child(3) {
        transform: translateY(-5.5px) rotate(-45deg);
    }
    .mobile-link {
        font-size: 13px;
        padding: 9px 12px;
        gap: 10px;
    }
    .mobile-icon {
        width: 24px;
        height: 24px;
    }
    .mobile-sheet {
        padding: 16px 14px 24px;
        border-radius: 16px 16px 0 0;
    }
    .mobile-close {
        width: 32px;
        height: 32px;
    }
    .mobile-logo-bridge {
        height: 24px;
    }
    .mobile-logo-eu {
        height: 16px;
    }
    .mobile-brand-divider {
        height: 18px;
    }
}

/* ─── ACCESSIBILITY ──────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
    .site-header *,
    .mobile-overlay * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

@media (prefers-contrast: high) {
    .header-bg {
        background: #fff;
        border-bottom: 2px solid var(--hdr-forest);
    }
    .nav-link.active {
        background: var(--hdr-forest);
        color: #fff;
    }
}

@media (prefers-reduced-transparency: reduce) {
    .header-bg {
        background: #fff;
        backdrop-filter: none;
    }
    .mobile-scrim {
        background: rgba(10, 22, 16, 0.88);
        backdrop-filter: none;
    }
    .mobile-sheet {
        background: #fff;
    }
}

/* ─── SCROLLBAR ──────────────────────────────────────────────────── */
::-webkit-scrollbar {
    width: 4px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: var(--hdr-hint);
    border-radius: 2px;
}
::-webkit-scrollbar-thumb:hover {
    background: var(--hdr-forest);
}
</style>

<!-- ================================================================ -->

<script>
(function() {
    'use strict';

    // ─── DOM REFS ──────────────────────────────────────────────────
    var header = document.getElementById('siteHeader');
    var toggle = document.getElementById('navToggle');
    var overlay = document.getElementById('mobileOverlay');
    var scrim = document.getElementById('mobileScrim');
    var closeBtn = document.getElementById('mobileClose');

    // ─── LOGO FALLBACK ─────────────────────────────────────────────
    document.querySelectorAll('.brand-logo, .mobile-logo').forEach(function(img) {
        img.addEventListener('error', function() {
            var base = this.src.replace(/\.[^.]+$/, '');
            var png = base + '.png';
            if (this.src !== png) {
                this.src = png;
            }
        });
    });

    // ─── MOBILE MENU ───────────────────────────────────────────────
    function openMenu() {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        toggle.classList.add('active');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        setTimeout(function() {
            var first = overlay.querySelector('.mobile-link');
            if (first) {
                first.focus();
            }
        }, 100);
    }

    function closeMenu() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        toggle.focus();
    }

    if (toggle) {
        toggle.addEventListener('click', function() {
            overlay.classList.contains('active') ? closeMenu() : openMenu();
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', closeMenu);
    }

    if (scrim) {
        scrim.addEventListener('click', function(e) {
            if (e.target === scrim) {
                closeMenu();
            }
        });
    }

    // ─── ESCAPE KEY ────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay && overlay.classList.contains('active')) {
            closeMenu();
        }
    });

    // ─── CLOSE ON LINK CLICK ───────────────────────────────────────
    if (overlay) {
        overlay.querySelectorAll('.mobile-link').forEach(function(link) {
            link.addEventListener('click', closeMenu);
        });
    }

    // ─── SCROLL BEHAVIOR ───────────────────────────────────────────
    if (header) {
        window.addEventListener('scroll', function() {
            var currentScroll = window.pageYOffset;
            header.classList.toggle('scrolled', currentScroll > 16);
        }, { passive: true });
    }

    // ─── ACTIVE LINK ───────────────────────────────────────────────
    function markActive() {
        var path = window.location.pathname;

        var trainingPaths = [
            '/training-and-wp5/',
            '/training-and-wp5/events/',
            '/training-and-wp5/training-materials/',
            '/training-and-wp5/sme-mentoring/',
            '/training-and-wp5/community-of-practice/',
            '/training-and-wp5/replication-toolkit/'
        ];

        document.querySelectorAll('.nav-link, .mobile-link').forEach(function(link) {
            var href = link.getAttribute('href');
            if (!href || href === '#') {
                return;
            }
            link.classList.remove('active');

            if (path === '/' || path === '') {
                if (href === '/' || href === '') {
                    link.classList.add('active');
                }
                return;
            }

            if (href === '/training-and-wp5/') {
                if (trainingPaths.some(function(tp) {
                    return path.startsWith(tp);
                })) {
                    link.classList.add('active');
                }
                return;
            }

            if (href !== '/' && path.startsWith(href)) {
                link.classList.add('active');
            }
        });
    }

    markActive();
    window.addEventListener('hashchange', markActive);

    // ─── RESIZE HANDLER ────────────────────────────────────────────
    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            if (window.innerWidth > 960 && overlay && overlay.classList.contains('active')) {
                closeMenu();
            }
        }, 200);
    });

    console.log('[BRIDGE-AI] Premium Header ready (Always Sticky)');

})();
</script>
<!-- END HEADER -->
